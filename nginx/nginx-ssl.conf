# HTTP：全部跳转到 HTTPS（统一 www 域名）
server {
    listen 80;
    server_name www.aigicrm.com aigicrm.com;
    return 301 https://www.aigicrm.com$request_uri;
}

# HTTPS：非 www 域名统一 301 到 www（避免 CORS Origin 不匹配导致接口 403）
server {
    listen 443 ssl;
    http2 on;
    server_name aigicrm.com;

    ssl_certificate     /etc/nginx/ssl/www.aigicrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aigicrm.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.aigicrm.com$request_uri;
}

# HTTPS：www 正式服务
server {
    listen 443 ssl;
    http2 on;
    server_name www.aigicrm.com;

    ssl_certificate     /etc/nginx/ssl/www.aigicrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aigicrm.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # gzip 压缩:JSON/JS/CSS 文本压缩率高(215KB 客户列表 -> ~50KB),慢网络下响应时间减 4-6 倍
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # 安全响应头(FEAT-20260804-FILE-INTEGRITY)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口不缓存:部署后用户刷新即取最新 index.html,避免旧版引用已删除 chunk 导致页面异常
    # 注意:本 location 有自己的 add_header 后不再继承 server 级安全头,须在此补齐
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 图标请求兜底(前端 dist 有 favicon.png;apple-touch-icon 无则 204)
    location = /favicon.ico {
        try_files /favicon.png =204;
    }
    location = /apple-touch-icon.png { return 204; }
    location = /apple-touch-icon-precomposed.png { return 204; }

    # API 代理（^~ 确保优先于下方静态资源正则匹配，否则 /api/.../*.png 等下载会被静态规则拦截导致 404）
    location ^~ /api/ {
        proxy_pass http://ycmn-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制
        client_max_body_size 100m;
    }

    # 静态资源缓存（含安全头，避免 server 级头被本 location 的 add_header 覆盖）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
