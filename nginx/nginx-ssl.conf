# HTTP：全部跳转到 HTTPS（统一 www 域名）
server {
    listen 80;
    server_name www.aigicrm.com aigicrm.com;
    return 301 https://www.aigicrm.com$request_uri;
}

# HTTPS：非 www 域名统一 301 到 www（避免 CORS Origin 不匹配导致接口 403）
server {
    listen 443 ssl;
    http2 on;
    server_name aigicrm.com;

    ssl_certificate     /etc/nginx/ssl/www.aigicrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aigicrm.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.aigicrm.com$request_uri;
}

# HTTPS：www 正式服务
server {
    listen 443 ssl;
    http2 on;
    server_name www.aigicrm.com;

    ssl_certificate     /etc/nginx/ssl/www.aigicrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aigicrm.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理（^~ 确保优先于下方静态资源正则匹配，否则 /api/.../*.png 等下载会被静态规则拦截导致 404）
    location ^~ /api/ {
        proxy_pass http://ycmn-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制
        client_max_body_size 100m;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
