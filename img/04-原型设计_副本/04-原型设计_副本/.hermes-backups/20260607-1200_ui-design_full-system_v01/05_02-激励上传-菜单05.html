    .nav-item .nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-item .nav-txt { flex: 1; }
    .nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; background: #ff4d4f; color: #fff; font-size: 11px; padding: 0 5px; font-weight: 600; line-height: 18px; }
    .nav-badge.warn { background: #fa8c16; }

    .nav-sub { display: block; padding: 0 0 4px 0; }

    .topbar { height: 56px; background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0; }

<script>
  // ===== 四项激励Plus · 上传模块 =====
  const STATS_DATA = [
    {cat:'外出参观',name:'南京参观【可共享】',pts:10},
    {cat:'外出参观',name:'终端考察【可共享】',pts:10},
    {cat:'交流拜访',name:'技术交流会【可共享】',pts:5},
    {cat:'交流拜访',name:'高层拜访【可共享】',pts:5},
    {cat:'两谈两做方案',name:'项目方案',pts:2},
    {cat:'两谈两做方案',name:'价值服务手册',pts:2},
    {cat:'两谈两做方案',name:'使用报告【可共享】',pts:2},
    {cat:'产品试点',name:'涂层类【都可共享】',pts:1},
    {cat:'产品试点',name:'楼梯板类【都可共享】',pts:1},
    {cat:'产品试点',name:'机封类【都可共享】',pts:1},
    {cat:'产品试点',name:'密封类【都可共享】',pts:1},
    {cat:'产品试点',name:'润滑类【都可共享】',pts:1}
  ];
  const PERSONS = ['王磊磊','李明','张三','赵四'];
  const ORG_MAP = {'王磊磊':'内蒙办','李明':'内蒙办','张三':'太原办','赵四':'内蒙办'};

  // Categories with item index ranges
  const CATS = [
    {id:'外出参观', icon:'map-pin', cls:'blue', start:0, count:2},
    {id:'交流拜访', icon:'users', cls:'green', start:2, count:2},
    {id:'两谈两做方案', icon:'file-text', cls:'orange', start:4, count:3},
    {id:'产品试点', icon:'flask', cls:'purple', start:7, count:5}
  ];

  var currentCatIdx = 0; // which category tab is active

  function loadFiles(){try{var s=localStorage.getItem('istats_files');return s?JSON.parse(s):[]}catch(e){return []}}
  function saveFiles(files){localStorage.setItem('istats_files',JSON.stringify(files))}
  function getFiles(person,period){return loadFiles().filter(function(f){return f.person===person&&f.period===period})}

  function toggleSubMenu(el) {
    var sub = document.getElementById('navSub');
    var arrow = el.querySelector('.sub-arrow');
    if(sub.style.display==='none'||!sub.style.display){
      sub.style.display='block';
      if(arrow) arrow.style.transform='rotate(0deg)';
    } else {
      sub.style.display='none';
      if(arrow) arrow.style.transform='rotate(-90deg)';
    }
  }

  // ===== 切换分类Tab =====
  function switchCat(catIdx) {
    currentCatIdx = catIdx;
    renderAll();
  }

  // ===== 文件上传 =====
  function uploadFile(itemIdx) {
    var input=document.getElementById('fileUploadInput');
    input.setAttribute('data-idx',itemIdx);
    input.click();
  }

  // 绑定文件选择事件
  document.addEventListener('DOMContentLoaded', function(){
    var input=document.getElementById('fileUploadInput');
    input.onchange=function(){
      var person=document.getElementById('selPerson').value;
      var period=document.getElementById('selPeriod').value;
      var files=loadFiles();var now=new Date();
      var ds=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      var idx=parseInt(this.getAttribute('data-idx'));
      var count=this.files.length;
      Array.from(this.files).forEach(function(file){
        files.push({id:'f_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),person:person,period:period,itemIdx:idx,fileName:file.name,fileSize:file.size,uploadDate:ds});
      });
      saveFiles(files);this.value='';
      renderAll();
      toast('✅ '+count+'个文件上传成功');
    };
  });

  // ===== 文件删除 =====
  function deleteFile(fileId){
    if(!confirm('确认删除此文件？'))return;
    var files=loadFiles().filter(function(f){return f.id!==fileId});
    saveFiles(files);
    renderAll();
    toast('已删除');
  }

  // ===== 渲染全部 =====
  function renderAll() {
    renderTabs();
    renderSubItems(currentCatIdx);
    renderFiles(currentCatIdx);
    lucide.createIcons();
  }

  // ===== 渲染Tab =====
  function renderTabs() {
    var html = '';
    CATS.forEach(function(c, i){
      var active = i===currentCatIdx ? ' active' : '';
      html += '<button class="cat-tab'+active+' '+c.cls+'" onclick="switchCat('+i+')">'+
        '<i class="tab-icon" data-lucide="'+c.icon+'"></i>'+c.id+'</button>';
    });
    document.getElementById('catTabs').innerHTML = html;
  }

  // ===== 渲染子项列表 =====
  function renderSubItems(catIdx) {
    var cat = CATS[catIdx];
    var section = document.getElementById('subitemSection');
    section.style.display = 'block';

    var headerHtml = '<div class="subitem-header">'+
      '<span class="cbadge '+cat.cls+'">'+cat.id+'</span>'+
      '<span style="font-weight:400;color:#8c8c8c;font-size:13px;">— 选择子项上传文件</span></div>';

    var listHtml = '<div class="subitem-list">';
    for(var i=0; i<cat.count; i++) {
      var idx = cat.start + i;
      var item = STATS_DATA[idx];
      listHtml += '<div class="subitem-row">'+
        '<div class="subitem-name">'+item.name+'</div>'+
        '<div class="subitem-pts">'+item.pts+'分</div>'+
        '<button class="subitem-btn" onclick="uploadFile('+idx+')">'+
          '<i data-lucide="upload" style="width:14px;height:14px;"></i> 上传文件</button>'+
        '</div>';
    }
    listHtml += '</div>';
    section.innerHTML = headerHtml + listHtml;
  }

  // ===== 渲染文件列表 =====
  function renderFiles(catIdx) {
    var person = document.getElementById('selPerson').value;
    var period = document.getElementById('selPeriod').value;
    var allFiles = getFiles(person, period);

    // Filter files that belong to this category
    var cat = CATS[catIdx];
    var catFiles = [];
    allFiles.forEach(function(f){
      if(f.itemIdx >= cat.start && f.itemIdx < cat.start + cat.count) {
        catFiles.push(f);
      }
    });

    // Sort by upload date descending
    catFiles.sort(function(a,b){ return a.uploadDate > b.uploadDate ? -1 : 1; });

    document.getElementById('fileCount').textContent = catFiles.length + ' 个文件';

    var area = document.getElementById('fileListArea');
    if(catFiles.length === 0) {
      area.innerHTML = '<div class="file-empty">暂无已上传文件</div>';
      return;
    }

    var html = '<table style="table-layout:fixed;" class="file-table"><thead><tr>'+
      '<th>文件名</th><th style="width:80px;">大小</th><th style="width:120px;">子项</th><th style="width:110px;">上传日期</th><th style="width:50px;">操作</th>'+
      '</tr></thead><tbody>';
    catFiles.forEach(function(f){
      var sizeStr = f.fileSize > 1024*1024
        ? (f.fileSize/1024/1024).toFixed(1)+'MB'
        : f.fileSize > 1024
          ? (f.fileSize/1024).toFixed(0)+'KB'
          : f.fileSize+'B';
      var item = STATS_DATA[f.itemIdx];
      var subitemName = item ? item.name : '—';
      html += '<tr>'+
        '<td><i data-lucide="file" class="file-icon" style="width:14px;height:14px;"></i>'+escapeHtml(f.fileName||'')+'</td>'+
        '<td class="file-size">'+sizeStr+'</td>'+
        '<td class="file-subitem">'+escapeHtml(subitemName)+'</td>'+
        '<td class="file-date">'+f.uploadDate+'</td>'+
        '<td><button class="file-del-btn" onclick="deleteFile(\''+f.id+'\')" title="删除"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button></td>'+
        '</tr>';
    });
    html += '</tbody></table>';
    area.innerHTML = html;
  }

  function escapeHtml(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(function(){el.classList.remove('show')},2000);}

  // ===== Init =====
  lucide.createIcons();
  renderAll();

  function toggleOrgSub(el) {
    var sub = document.getElementById('orgSub');
    var arrow = el.querySelector('.sub-arrow');
    if (!sub) return;
    sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
    if (arrow) arrow.style.transform = sub.style.display === 'block' ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
  function toggleScoreSub(el) {
    var sub = document.getElementById('scoreSub');
    if (!sub) return;
    sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
    var arrow = el.querySelector('.sub-arrow');
    if (arrow) arrow.style.transform = sub.style.display === 'block' ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
</script>
</body>
</html>
