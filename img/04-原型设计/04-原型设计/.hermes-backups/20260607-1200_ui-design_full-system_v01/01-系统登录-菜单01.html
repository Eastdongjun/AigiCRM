<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运筹马年 · 市场资源管理系统</title>
  <script src="https://unpkg.com/lucide@latest">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #022d57 0%, #02438a 40%, #04549c 100%);
    }

    /* ── 全屏覆盖层 ── */
    #login-cover {
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #022d57 0%, #02438a 40%, #04549c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 主容器 ── */
    .login-container {
      display: flex;
      width: 960px;
      max-width: 92vw;
      min-height: 580px;
      background: transparent;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.45);
      position: relative;
    }

    /* ── 左侧品牌区 ── */
    .brand-area {
      flex: 0 0 42%;
      background: linear-gradient(135deg, #022d57 0%, #033e7a 60%, #024a94 100%);
      padding: 48px 40px 40px 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .brand-area::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #1990ff, #47a5ff, #1990ff);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
    }

    .brand-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #1990ff, #47a5ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(25, 144, 255, 0.35);
    }

    .brand-logo-text {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .brand-title {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .brand-title em {
      font-style: normal;
      background: linear-gradient(90deg, #47a5ff, #79bcff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 2px;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .brand-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .brand-feature {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .brand-feature .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #47a5ff;
      flex-shrink: 0;
    }

    /* ── 右侧登录卡片 ── */
    .login-card {
      flex: 0 0 58%;
      background: #ffffff;
      padding: 52px 56px 48px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #1990ff, #47a5ff, #1990ff);
    }

    .card-header {
      margin-bottom: 36px;
    }

    .card-welcome {
      font-size: 13px;
      color: #8a9bb5;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a2a4a;
      letter-spacing: 1px;
    }

    .card-title span {
      color: #1990ff;
    }

    /* ── 表单 ── */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a2a4a;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #8a9bb5;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 0 10px 28px;
      border: none;
      border-bottom: 1.5px solid #dfe5ed;
      font-size: 14px;
      color: #1a2a4a;
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .input-wrapper input::placeholder {
      color: #ababab;
      font-size: 13px;
    }

    .input-wrapper input:focus {
      border-bottom-color: #1990ff;
    }

    /* ── 记住我 & 忘记密码 ── */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: 
      margin-bottom: 28px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      display: none;
    }

    .check-box {
      width: 16px;
      height: 16px;
      border: 1.5px solid #c8d0dc;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      flex-shrink: 0;
      background: #fff;
    }

    .remember-me input:checked + .check-box {
      background: #1990ff;
      border-color: #1990ff;
    }

    .remember-me input:checked + .check-box::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-top: -1px;
    }

    .remember-text {
      font-size: 13px;
      color: #5a6a7a;
    }

    .forgot-link {
      font-size: 13px;
      color: #1990ff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* ── 登录按钮 ── */
    .login-btn {
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(135deg, #06539c 0%, #0d67ba 100%);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 6px;
      cursor: pointer;
      transition: color 0.25s;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(6, 83, 156, 0.35);
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #04467f 0%, #0a59a5 100%);
      box-shadow: 0 6px 20px rgba(6, 83, 156, 0.45);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(6, 83, 156, 0.3);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1a2a4a;
      color: #fff;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      z-index: 10000;
      opacity: 0;
      transition: color 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      color: #52c41a;
      flex-shrink: 0;
    }

    /* ── 底部版权 ── */
    .copyright {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.5px;
      z-index: 9998;
      pointer-events: none;
    }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
        width: 94vw;
        min-height: auto;
      }
      .brand-area {
        flex: none;
        padding: 32px 28px 28px;
        min-height: 200px;
      }
      .brand-area::after {
        right: 0;
        top: auto;
        bottom: 0;
        width: 100%;
        height: 2px;
      }
      .brand-title {
        font-size: 28px;
      }
      .login-card {
        flex: none;
        padding: 32px 24px 36px;
      }
      .login-card::before {
        left: 0;
        top: 0;
        width: 100%;
        height: 3px;
      }
      .brand-logo {
        margin-bottom: 24px;
      }
      .brand-features {
        display: none;
      }
    }
  
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #1890ff; outline-offset: 2px; }
  </style>
</head>
<body>

  <!-- ── 全屏覆盖层 ── -->
  <div id="login-cover">
    <div class="login-container">

      <!-- 左侧品牌区 -->
      <div class="brand-area">
        <div class="brand-logo">
          <div class="brand-logo-icon" data-lucide="layout-grid"></div>
          <span class="brand-logo-text">WANG LEI LEI</span>
        </div>
        <div class="brand-title">运筹<em>马年</em></div>
        <div class="brand-subtitle">市场资源管理系统</div>
        <div class="brand-features">
          <div class="brand-feature">
            <span class="dot"></span>
            客户管理
          </div>
          <div class="brand-feature">
            <span class="dot"></span>
            阶段推进
          </div>
          <div class="brand-feature">
            <span class="dot"></span>
            数据洞察
          </div>
        </div>
      </div>

      <!-- 右侧登录卡片 -->
      <div class="login-card">
        <div class="card-header">
          <div class="card-welcome">WELCOME BACK</div>
          <div class="card-title">用户<span>登录</span></div>
        </div>

        <!-- 账号 -->
        <div class="form-group">
          <label class="form-label">账号</label>
          <div class="input-wrapper">
            <i class="input-icon" data-lucide="user" style="width:18px;height:18px;"></i>
            <input type="text" placeholder="请输入账号" autocomplete="username">
          </div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-wrapper">
            <i class="input-icon" data-lucide="lock" style="width:18px;height:18px;"></i>
            <input type="password" placeholder="请输入密码" autocomplete="current-password">
          </div>
        </div>

        <!-- 记住我 & 忘记密码 -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" checked>
            <span class="check-box"></span>
            <span class="remember-text">记住我</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link">忘记密码?</a>
        </div>

        <!-- 登录按钮 -->
        <button class="login-btn" id="loginBtn">登 录</button>
      </div>

    </div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast">
    <i class="toast-icon" data-lucide="check-circle" style="width:20px;height:20px;"></i>
    <span>登录成功，欢迎回来！</span>
  </div>

  <!-- ── 版权 ── -->
  <div class="copyright">
    &copy; 2026 运筹马年客户管理系统 &nbsp;·&nbsp; All Rights Reserved
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 初始化 lucide 图标
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      const cover = document.getElementById('login-cover');
      const btn = document.getElementById('loginBtn');
      const toast = document.getElementById('toast');

      btn.addEventListener('click', function () {
        // 移除覆盖层
        cover.style.transition = 'opacity 0.4s ease';
        cover.style.opacity = '0';
        setTimeout(function () {
          cover.style.display = 'none';
        }, 400);

        // 弹出 toast
        toast.classList.add('show');
        setTimeout(function () {
          toast.classList.remove('show');
        }, 3000);
      });
    });
  </script>

</body>
</html>
