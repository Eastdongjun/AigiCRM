        <select id="selPerson" onchange="renderAll()">
          <option>王磊磊</option><option>李明</option><option>张三</option><option>赵四</option>
        </select>
        <label>周期</label>
        <select id="selPeriod" onchange="renderAll()">
          <option>2026上半年</option><option>2026下半年</option><option>2025下半年</option>

      <!-- ===== 分类Tab ===== -->
      <div class="cat-tabs" id="catTabs"></div>

      <div class="body-row">
      <!-- ===== 子项列表 ===== -->
      <div class="subitem-section" id="subitemSection" style="display:none;"></div>

      <!-- ===== 已上传文件列表 ===== -->
      <div class="file-section">
        <div class="file-header">
          <h3>已上传文件</h3>

              <option value="">全部分类</option>

            <select id="filterSub" onchange="filePgPage=1;renderFiles()" style="height:30px;padding:0 24px 0 8px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;background:#fff;outline:none;appearance:auto;">
              <option value="">全部子类</option>

        </div>

    </div><!-- /body-row -->
    </div><!-- /content -->

</div><!-- /app -->

<!-- 客户选择弹窗（两步） -->
<div class="cmodal-overlay" id="clientModal" onclick="if(event.target===this)closeClientModal()">
  <div class="cmodal" onclick="event.stopPropagation()">
    <div class="cmodal-hd">
      <h3 id="clientModalTitle">关联客户</h3>
      <button class="cmodal-close" onclick="closeClientModal()">&times;</button>
    </div>
    <!-- Step 1: 选客户 -->
    <div class="cmodal-body" id="modalStep1">
      <label>选择关联客户 <span style="color:#ff4d4f;">*</span></label>
      <select id="clientSelect">
        <option value="">请选择客户</option>
        <option>陕煤榆林化学有限公司</option>
        <option>内蒙古汇能</option>
        <option>国能榆林化工</option>
        <option>神东哈拉沟煤矿</option>
        <option>凯越煤化</option>
        <option>准能集团</option>
        <option>中煤蒙大</option>
        <option>大唐托电</option>
        <option>伊泰煤炭</option>
        <option>榆林新材料</option>

        <i data-lucide="upload" style="width:16px;height:16px;"></i> 选择文件上传
      </button>
    </div>
    <div class="cmodal-ft" id="modalFt1">
      <button class="btn" style="padding:6px 16px;font-size:12px;" onclick="closeClientModal()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="goStep2()">下一步</button>
    </div>
    <div class="cmodal-ft" id="modalFt2" style="display:none;">
      <button class="btn" style="padding:6px 16px;font-size:12px;" onclick="goStep1()">上一步</button>

<!-- 文件上传隐藏input -->
<input type="file" id="fileUploadInput" style="display:none;" multiple>
<!-- 替换文件专用input -->
<input type="file" id="replaceFileInput" style="display:none;">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ===== 四项激励Plus · 上传模块（二级嵌套结构） =====
  var INCENTIVE_CATS = [
    {
      id:'外出参观', icon:'map-pin', cls:'blue',
      subs:[
        { name:'南京参观', tiers:[
          {label:'<1/场',pts:0},{label:'<2/场',pts:1},{label:'分厂级',pts:2},{label:'老总级',pts:3}
        ]},
        { name:'终端考察', tiers:[
          {label:'<1/场',pts:0},{label:'<2/场',pts:1},{label:'分厂级',pts:2},{label:'老总级',pts:3}
        ]}
      ]
    },
    {
      id:'交流拜访', icon:'users', cls:'green',
      subs:[
        { name:'技术交流会', tiers:[
          {label:'<1/场',pts:0},{label:'<2/场',pts:1},{label:'<4/场',pts:2},{label:'≥4/场',pts:3}
        ]},
        { name:'高层拜访', tiers:[
          {label:'<1/场',pts:0},{label:'<2/场',pts:1},{label:'主管总',pts:2},{label:'总经理',pts:3}
        ]}
      ]
    },
    {
      id:'两谈两做方案', icon:'file-text', cls:'orange',
      subs:[
        { name:'项目方案', tiers:[
          {label:'<1/年',pts:0},{label:'<3/年',pts:1},{label:'<5/年',pts:2},{label:'≥5/年',pts:3}
        ]},
        { name:'价值服务手册', tiers:[
          {label:'<1/年',pts:0},{label:'<3/年',pts:1},{label:'<5/年',pts:2},{label:'≥5/年',pts:3}
        ]},
        { name:'使用报告【可共享】', tiers:[
          {label:'<1/年',pts:0},{label:'<3/年',pts:1},{label:'<5/年',pts:2},{label:'≥5/年',pts:3}
        ]}
      ]
    },
    {
      id:'产品试点', icon:'flask-conical', cls:'purple',
      subs:[
        { name:'涂层类【都可共享】', tiers:[
          {label:'<2/年',pts:0},{label:'<5/年',pts:1},{label:'<12/年',pts:2},{label:'≥12/年',pts:3}
        ]},
        { name:'楼梯板类【都可共享】', tiers:[
          {label:'<2/年',pts:0},{label:'<5/年',pts:1},{label:'<12/年',pts:2},{label:'≥12/年',pts:3}
        ]},
        { name:'机封类【都可共享】', tiers:[
          {label:'<2/年',pts:0},{label:'<5/年',pts:1},{label:'<12/年',pts:2},{label:'≥12/年',pts:3}
        ]},
        { name:'密封类【都可共享】', tiers:[
          {label:'<2/年',pts:0},{label:'<5/年',pts:1},{label:'<12/年',pts:2},{label:'≥12/年',pts:3}
        ]},
        { name:'润滑类【都可共享】', tiers:[
          {label:'<2/年',pts:0},{label:'<5/年',pts:1},{label:'<12/年',pts:2},{label:'≥12/年',pts:3}
        ]}
      ]
    }
  ];

  var currentCat = 0;
  var pending = null; // {catIdx, subIdx, tierIdx}

  function loadFiles(){try{var s=localStorage.getItem('istats_files');return s?JSON.parse(s):[]}catch(e){return []}}
  function saveFiles(files){localStorage.setItem('istats_files',JSON.stringify(files))}
  function getFiles(person,period){return loadFiles().filter(function(f){return f.person===person&&f.period===period})}

  // Seed mock data for demo (only if empty)
  function seedMockFiles() {
    if (loadFiles().length > 0) return;
    var mock = [];
    var persons = ['王磊磊','李明','张三'];
    var clients = ['陕煤榆林化学有限公司','内蒙古汇能','国能榆林化工','神东哈拉沟煤矿','凯越煤化','准能集团'];
    var catIdxs = [0,0,1,2,3,0,1,3,0,2,1,3,2,0,1,3,2,1,0,3];
    var subIdxs = [0,1,0,1,0,0,1,3,1,2,0,1,0,0,1,2,1,0,0,4];
    var tierIdxs= [0,2,1,0,3,1,0,2,1,0,2,3,0,1,2,0,1,3,0,2];
    var dates = ['2026-06-07','2026-06-05','2026-06-03','2026-06-01','2026-05-28','2026-05-25','2026-05-20','2026-05-18','2026-05-15','2026-05-12','2026-05-10','2026-05-08','2026-05-05','2026-05-01','2026-04-28','2026-04-25','2026-04-20','2026-04-15','2026-04-10','2026-04-05'];
    var names = ['技术参数方案.docx','商务报价表.xlsx','拜访纪要.pdf','考察报告.pptx','涂层测试报告.pdf','新产品参数表.xlsx','客户需求文档.docx','试点总结.pptx','方案对比表.xlsx','技术方案终版.docx','月度汇报.pptx','采购清单.xlsx','合作框架协议.pdf','设备清单.docx','密封件参数.pdf','年度总结.docx','测试数据.xlsx','会议纪要.docx','产品目录.pdf','技术交底.docx'];
    for (var i = 0; i < 20; i++) {
      mock.push({
        id: 'seed_'+i,
        person: persons[i % 3],
        period: '2026上半年',
        catIdx: catIdxs[i], subIdx: subIdxs[i], tierIdx: tierIdxs[i],
        clientName: clients[i % 6],
        fileName: names[i],
        fileSize: (120 + Math.floor(Math.random()*500)) * 1024,
        uploadDate: dates[i]
      });
    }
    saveFiles(mock);
  }

  function ptsClass(pts) {
    if (pts === 0) return '#bfbfbf';
    if (pts === 1) return '#1890ff';
    if (pts === 2) return '#52c41a';
    return '#fa8c16';
  }

  function toggleSubMenu(el) {
    var sub = document.getElementById('navSub');
    var arrow = el.querySelector('.sub-arrow');
    if(sub.style.display==='none'||!sub.style.display){
      sub.style.display='block'; if(arrow) arrow.style.transform='rotate(0deg)';
    } else {
      sub.style.display='none'; if(arrow) arrow.style.transform='rotate(-90deg)';
    }
  }

  function switchCat(idx) { currentCat = idx; filePgPage = 1; renderAll(); }

  // ===== Upload flow (two-step modal) =====
  function uploadFile(catIdx, subIdx, tierIdx) {
    pending = {catIdx:catIdx, subIdx:subIdx, tierIdx:tierIdx};
    var cat = INCENTIVE_CATS[catIdx];
    var sub = cat.subs[subIdx];
    document.getElementById('clientModalTitle').textContent = '关联客户 · ' + sub.name;
    // Reset to step 1
    document.getElementById('modalStep1').style.display = '';
    document.getElementById('modalStep2').style.display = 'none';
    document.getElementById('modalFt1').style.display = '';
    document.getElementById('modalFt2').style.display = 'none';
    document.getElementById('clientSelect').value = '';
    document.getElementById('clientModal').classList.add('show');
  }

  function closeClientModal() {
    document.getElementById('clientModal').classList.remove('show');
    pending = null;
  }

  function goStep2() {
    var client = document.getElementById('clientSelect').value;
    if (!client) { toast('请选择关联客户'); return; }
    document.getElementById('modalClientName').textContent = client;
    document.getElementById('modalStep1').style.display = 'none';
    document.getElementById('modalStep2').style.display = '';
    document.getElementById('modalFt1').style.display = 'none';
    document.getElementById('modalFt2').style.display = '';
  }

  function goStep1() {
    document.getElementById('modalStep1').style.display = '';
    document.getElementById('modalStep2').style.display = 'none';
    document.getElementById('modalFt1').style.display = '';
    document.getElementById('modalFt2').style.display = 'none';
  }

  function triggerFileUpload() {
    var client = document.getElementById('modalClientName').textContent;
    closeClientModal();
    var input = document.getElementById('fileUploadInput');
    input.setAttribute('data-catIdx', pending.catIdx);
    input.setAttribute('data-subIdx', pending.subIdx);
    input.setAttribute('data-tierIdx', pending.tierIdx);
    input.setAttribute('data-client', client);
    input.click();
  }

  document.addEventListener('DOMContentLoaded', function(){
    var input = document.getElementById('fileUploadInput');
    input.onchange = function() {
      var person = document.getElementById('selPerson').value;
      var period = document.getElementById('selPeriod').value;
      var files = loadFiles(); var now = new Date();
      var ds = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      var ci = parseInt(this.getAttribute('data-catIdx'));
      var si = parseInt(this.getAttribute('data-subIdx'));
      var ti = parseInt(this.getAttribute('data-tierIdx'));
      var client = this.getAttribute('data-client') || '';
      var cnt = this.files.length;
      Array.from(this.files).forEach(function(file){
        files.push({id:'f_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),person:person,period:period,catIdx:ci,subIdx:si,tierIdx:ti,clientName:client,fileName:file.name,fileSize:file.size,uploadDate:ds});
      });
      saveFiles(files); this.value = '';
      renderAll();
      toast('✅ '+cnt+'个文件上传成功');
    };
  });

  function deleteFile(fileId) {
    if(!confirm('确认删除此文件？'))return;
    var files = loadFiles().filter(function(f){return f.id!==fileId});
    saveFiles(files);
    renderAll();
    toast('已删除');
  }

  function replaceFile(fileId) {
    var input = document.getElementById('replaceFileInput');
    input.setAttribute('data-replace-id', fileId);
    input.click();
  }

  document.addEventListener('DOMContentLoaded', function(){
    // Replace file handler
    document.getElementById('replaceFileInput').onchange = function() {
      var fileId = this.getAttribute('data-replace-id');
      var newFile = this.files[0];
      if (!newFile) return;
      var files = loadFiles();
      var idx = -1;
      for (var i = 0; i < files.length; i++) {
        if (files[i].id === fileId) { idx = i; break; }
      }
      if (idx >= 0) {
        var now = new Date();
        var ds = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
        files[idx].fileName = newFile.name;
        files[idx].fileSize = newFile.size;
        files[idx].uploadDate = ds;
      }
      saveFiles(files); this.value = '';
      renderAll();
      toast('✅ 文件已替换');
    };
  });

  // ===== Rendering =====
  function renderAll() {
    filePgPage = 1;
    populateFilters();
    renderTabs();
    renderSubItems();
    renderFiles();
    lucide.createIcons();
  }

  function populateFilters() {
    // Populate filterCat dropdown once
    var catSel = document.getElementById('filterCat');
    if (catSel.options.length <= 1) {
      INCENTIVE_CATS.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.id;
        catSel.appendChild(opt);
      });
    }
    // Populate filterSub based on current category
    var subSel = document.getElementById('filterSub');
    subSel.innerHTML = '<option value="">全部子类</option>';
    var cat = INCENTIVE_CATS[currentCat];
    cat.subs.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.name; opt.textContent = s.name;
      subSel.appendChild(opt);
    });
  }

  function renderTabs() {
    var html = '';
    INCENTIVE_CATS.forEach(function(c, i){
      var act = i===currentCat ? ' active' : '';
      html += '<button class="cat-tab'+act+' '+c.cls+'" onclick="switchCat('+i+')">'+
        '<i class="tab-icon" data-lucide="'+c.icon+'"></i>'+c.id+'</button>';
    });
    document.getElementById('catTabs').innerHTML = html;
  }

  function renderSubItems() {
    var cat = INCENTIVE_CATS[currentCat];
    var section = document.getElementById('subitemSection');
    section.style.display = 'block';

    var html = '<div class="subitem-header">'+
      '<span class="cbadge '+cat.cls+'">'+cat.id+'</span>'+
      '<span style="font-weight:400;color:#8c8c8c;font-size:13px;">— 选择子项上传文件</span></div>';

    cat.subs.forEach(function(sub, si) {
      html += '<div class="sub-group">'+
        '<div class="sub-group-hd accent-'+cat.cls+'">'+sub.name+'</div>';
      sub.tiers.forEach(function(tier, ti) {
        html += '<div class="subitem-row">'+
          '<div class="subitem-name">'+tier.label+'</div>'+
          '<div class="subitem-pts" style="background:'+ptsClass(tier.pts)+'15;color:'+ptsClass(tier.pts)+';">'+tier.pts+'分</div>'+
          '<button class="subitem-btn" onclick="uploadFile('+currentCat+','+si+','+ti+')">'+
            '<i data-lucide="upload" style="width:14px;height:14px;"></i> 上传文件</button>'+
          '</div>';
      });
      html += '</div>';
    });
    section.innerHTML = html;
  }

  var filePgPage = 1;
  var filePgSize = 10;

  function renderFiles() {
    var person = document.getElementById('selPerson').value;
    var period = document.getElementById('selPeriod').value;
    var allFiles = getFiles(person, period);
    var catFiles = allFiles.filter(function(f){ return f.catIdx === currentCat; });
    // Search filter — text + dropdowns
    var query = (document.getElementById('fileSearchInput').value || '').trim().toLowerCase();
    var filterCat = document.getElementById('filterCat').value;
    var filterSub = document.getElementById('filterSub').value;

    if (filterCat) {
      catFiles = catFiles.filter(function(f) {
        var c = INCENTIVE_CATS[f.catIdx];
        return c && c.id === filterCat;
      });
    }
    if (filterSub) {
      catFiles = catFiles.filter(function(f) {
        var c = INCENTIVE_CATS[f.catIdx];
        var s = c && c.subs[f.subIdx];
        return s && s.name === filterSub;
      });
    }
    if (query) {
      catFiles = catFiles.filter(function(f) {
        var c = INCENTIVE_CATS[f.catIdx];
        var s = c && c.subs[f.subIdx];
        var t = s && s.tiers[f.tierIdx];
        var txt = [c?c.id:'', s?s.name:'', t?t.label:'', String(t?t.pts:''), f.fileName||'', f.clientName||'', f.person||'', f.uploadDate||''].join(' ').toLowerCase();
        return txt.indexOf(query) >= 0;
      });
    }
    catFiles.sort(function(a,b){ return a.uploadDate > b.uploadDate ? -1 : 1; });

    var total = catFiles.length;
    var totalPages = Math.ceil(total / filePgSize) || 1;
    if (filePgPage > totalPages) filePgPage = totalPages;
    var start = (filePgPage - 1) * filePgSize;
    var pageData = catFiles.slice(start, start + filePgSize);

    document.getElementById('fileCount').textContent = total + ' 个文件';
    var area = document.getElementById('fileListArea');

    var html = '<table style="table-layout:fixed;" class="file-table"><thead><tr>'+
      '<th style="width:110px;">大类·子类</th><th style="width:56px;">档位</th><th style="width:36px;">分</th>'+
      '<th style="width:180px;">文件名</th><th style="width:80px;">客户</th><th style="width:80px;">上传时间</th>'+
      '<th style="width:52px;">操作人</th><th style="width:100px;">操作</th>'+
      '</tr></thead><tbody>';

    if (!pageData.length) {
      html += '<tr><td colspan="8" class="file-empty">' + (query ? '未找到匹配文件' : '暂无已上传文件') + '</td></tr>';
      html += '</tbody></table>';
      area.innerHTML = html;
      document.getElementById('filePagination').style.display = 'none';
      return;
    }

    pageData.forEach(function(f){
      var c = INCENTIVE_CATS[f.catIdx];
      var s = c && c.subs[f.subIdx];
      var t = s && s.tiers[f.tierIdx];
      var catSub = (c?c.id:'') + ' · ' + (s?s.name:'');
      var tierLabel = t ? t.label : '—';
      var tierPts = t ? t.pts : 0;
      html += '<tr>'+
        '<td style="font-size:12px;">'+escapeHtml(catSub)+'</td>'+
        '<td style="font-size:12px;">'+escapeHtml(tierLabel)+'</td>'+
        '<td style="font-weight:600;color:#1890ff;">'+tierPts+'</td>'+
        '<td><i data-lucide="file" style="width:13px;height:13px;color:#8c8c8c;margin-right:5px;flex-shrink:0;"></i>'+escapeHtml(f.fileName||'')+'</td>'+
        '<td style="font-size:12px;color:#1890ff;">'+escapeHtml(f.clientName||'—')+'</td>'+
        '<td style="font-size:12px;color:#8c8c8c;">'+f.uploadDate+'</td>'+
        '<td style="font-size:12px;">'+escapeHtml(f.person||'—')+'</td>'+
        '<td><button class="file-act" onclick="replaceFile(\''+f.id+'\')" title="替换"><i data-lucide="refresh-cw" style="width:12px;height:12px;"></i> 替换</button>'+
        '<button class="file-act danger" onclick="deleteFile(\''+f.id+'\')"><i data-lucide="trash-2" style="width:12px;height:12px;"></i> 删除</button></td>'+
        '</tr>';
    });
    html += '</tbody></table>';
    area.innerHTML = html;

    // Pagination
    renderFilePagination(total, totalPages);
  }

  function renderFilePagination(total, totalPages) {
    var pg = document.getElementById('filePagination');
    if (totalPages <= 1) { pg.style.display = 'none'; return; }
    pg.style.display = 'flex';
    var html = '<span>共 ' + total + ' 条</span><div class="pg-btns">';
    html += '<button class="pg-btn' + (filePgPage <= 1 ? ' disabled' : '') + '" onclick="goFilePage(' + (filePgPage - 1) + ')">‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      html += '<button class="pg-btn' + (i === filePgPage ? ' active' : '') + '" onclick="goFilePage(' + i + ')">' + i + '</button>';
    }
    html += '<button class="pg-btn' + (filePgPage >= totalPages ? ' disabled' : '') + '" onclick="goFilePage(' + (filePgPage + 1) + ')">›</button>';
    html += '</div>';
    pg.innerHTML = html;
  }

  function goFilePage(p) {
    filePgPage = p;
    renderFiles();
  }

  function escapeHtml(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(function(){el.classList.remove('show')},2000);}

  seedMockFiles();
  lucide.createIcons();
  renderAll();

  function toggleOrgSub(el) {
    var sub = document.getElementById('orgSub');
    var arrow = el.querySelector('.sub-arrow');
    if (!sub) return;
    sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
    if (arrow) arrow.style.transform = sub.style.display === 'block' ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
  function toggleScoreSub(el) {
    var sub = document.getElementById('scoreSub');
    if (!sub) return;
    sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
    var arrow = el.querySelector('.sub-arrow');
    if (arrow) arrow.style.transform = sub.style.display === 'block' ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
</script>
