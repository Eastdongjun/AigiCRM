        <option>大唐托电</option>
        <option>伊泰煤炭</option>
        <option>榆林新材料</option>
      </select>
    </div>
    <div class="cmodal-ft">
      <button class="btn" style="padding:6px 16px;font-size:12px;" onclick="closeClientModal()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="confirmClientUpload()">确认并上传</button>
    </div>
  </div>
</div>

<!-- 文件上传隐藏input -->
<input type="file" id="fileUploadInput" style="display:none;" multiple>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ===== 四项激励Plus · 上传模块（二级嵌套结构） =====
  var INCENTIVE_CATS = [
    {
      id:'外出参观', icon:'map-pin', cls:'blue',
      subs:[
        { name:'南京参观', tiers:[
          {label:'<1/场 □',pts:0},{label:'<2/场 □',pts:1},{label:'分厂级 □',pts:2},{label:'老总级 □',pts:3}
        ]},
        { name:'终端考察', tiers:[
          {label:'<1/场 □',pts:0},{label:'<2/场 □',pts:1},{label:'分厂级 □',pts:2},{label:'老总级 □',pts:3}
        ]}
      ]
    },
    {
      id:'交流拜访', icon:'users', cls:'green',
      subs:[
        { name:'技术交流会', tiers:[
          {label:'<1/场 □',pts:0},{label:'<2/场 □',pts:1},{label:'<4/场 □',pts:2},{label:'≥4/场 □',pts:3}
        ]},
        { name:'高层拜访', tiers:[
          {label:'<1/场 □',pts:0},{label:'<2/场 □',pts:1},{label:'主管总 □',pts:2},{label:'总经理 □',pts:3}
        ]}
      ]
    },
    {
      id:'两谈两做方案', icon:'file-text', cls:'orange',
      subs:[
        { name:'项目方案', tiers:[
          {label:'<1/年 □',pts:0},{label:'<3/年 □',pts:1},{label:'<5/年 □',pts:2},{label:'≥5/年 □',pts:3}
        ]},
        { name:'价值服务手册', tiers:[
          {label:'<1/年 □',pts:0},{label:'<3/年 □',pts:1},{label:'<5/年 □',pts:2},{label:'≥5/年 □',pts:3}
        ]},
        { name:'使用报告【可共享】', tiers:[
          {label:'<1/年 □',pts:0},{label:'<3/年 □',pts:1},{label:'<5/年 □',pts:2},{label:'≥5/年 □',pts:3}
        ]}
      ]
    },
    {
      id:'产品试点', icon:'flask-conical', cls:'purple',
      subs:[
        { name:'涂层类【都可共享】', tiers:[
          {label:'<2/年 □',pts:0},{label:'<5/年 □',pts:1},{label:'<12/年 □',pts:2},{label:'≥12/年 □',pts:3}
        ]},
        { name:'楼梯板类【都可共享】', tiers:[
          {label:'<2/年 □',pts:0},{label:'<5/年 □',pts:1},{label:'<12/年 □',pts:2},{label:'≥12/年 □',pts:3}
        ]},
        { name:'机封类【都可共享】', tiers:[
          {label:'<2/年 □',pts:0},{label:'<5/年 □',pts:1},{label:'<12/年 □',pts:2},{label:'≥12/年 □',pts:3}
        ]},
        { name:'密封类【都可共享】', tiers:[
          {label:'<2/年 □',pts:0},{label:'<5/年 □',pts:1},{label:'<12/年 □',pts:2},{label:'≥12/年 □',pts:3}
        ]},
        { name:'润滑类【都可共享】', tiers:[
          {label:'<2/年 □',pts:0},{label:'<5/年 □',pts:1},{label:'<12/年 □',pts:2},{label:'≥12/年 □',pts:3}
        ]}
      ]
    }
  ];

  var currentCat = 0;
  var pending = null; // {catIdx, subIdx, tierIdx}

  function loadFiles(){try{var s=localStorage.getItem('istats_files');return s?JSON.parse(s):[]}catch(e){return []}}
  function saveFiles(files){localStorage.setItem('istats_files',JSON.stringify(files))}
  function getFiles(person,period){return loadFiles().filter(function(f){return f.person===person&&f.period===period})}

  function ptsClass(pts) {
    if (pts === 0) return '#bfbfbf';
    if (pts === 1) return '#1890ff';
    if (pts === 2) return '#52c41a';
    return '#fa8c16';
  }

  function toggleSubMenu(el) {
    var sub = document.getElementById('navSub');
    var arrow = el.querySelector('.sub-arrow');
    if(sub.style.display==='none'||!sub.style.display){
      sub.style.display='block'; if(arrow) arrow.style.transform='rotate(0deg)';
    } else {
      sub.style.display='none'; if(arrow) arrow.style.transform='rotate(-90deg)';
    }
  }

  function switchCat(idx) { currentCat = idx; renderAll(); }

  // ===== Upload flow =====
  function uploadFile(catIdx, subIdx, tierIdx) {
    pending = {catIdx:catIdx, subIdx:subIdx, tierIdx:tierIdx};
    var cat = INCENTIVE_CATS[catIdx];
    var sub = cat.subs[subIdx];
    var tier = sub.tiers[tierIdx];
    document.getElementById('clientModalTitle').textContent = '关联客户 · ' + sub.name;
    document.getElementById('clientSelect').value = '';
    document.getElementById('clientModal').classList.add('show');
  }

  function closeClientModal() {
    document.getElementById('clientModal').classList.remove('show');
    pending = null;
  }

  function confirmClientUpload() {
    var client = document.getElementById('clientSelect').value;
    if (!client) { toast('请选择关联客户'); return; }
    closeClientModal();
    var input = document.getElementById('fileUploadInput');
    input.setAttribute('data-catIdx', pending.catIdx);
    input.setAttribute('data-subIdx', pending.subIdx);
    input.setAttribute('data-tierIdx', pending.tierIdx);
    input.setAttribute('data-client', client);
    input.click();
  }

  document.addEventListener('DOMContentLoaded', function(){
    var input = document.getElementById('fileUploadInput');
    input.onchange = function() {
      var person = document.getElementById('selPerson').value;
      var period = document.getElementById('selPeriod').value;
      var files = loadFiles(); var now = new Date();
      var ds = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      var ci = parseInt(this.getAttribute('data-catIdx'));
      var si = parseInt(this.getAttribute('data-subIdx'));
      var ti = parseInt(this.getAttribute('data-tierIdx'));
      var client = this.getAttribute('data-client') || '';
      var cnt = this.files.length;
      Array.from(this.files).forEach(function(file){
        files.push({id:'f_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),person:person,period:period,catIdx:ci,subIdx:si,tierIdx:ti,clientName:client,fileName:file.name,fileSize:file.size,uploadDate:ds});
      });
      saveFiles(files); this.value = '';
      renderAll();
      toast('✅ '+cnt+'个文件上传成功');
    };
  });

  function deleteFile(fileId) {
    if(!confirm('确认删除此文件？'))return;
    var files = loadFiles().filter(function(f){return f.id!==fileId});
    saveFiles(files);
    renderAll();
    toast('已删除');
  }

  // ===== Rendering =====
  function renderAll() {
    renderTabs();
    renderSubItems();
    renderFiles();
    lucide.createIcons();
  }

  function renderTabs() {
    var html = '';
    INCENTIVE_CATS.forEach(function(c, i){
      var act = i===currentCat ? ' active' : '';
      html += '<button class="cat-tab'+act+' '+c.cls+'" onclick="switchCat('+i+')">'+
        '<i class="tab-icon" data-lucide="'+c.icon+'"></i>'+c.id+'</button>';
    });
    document.getElementById('catTabs').innerHTML = html;
  }

  function renderSubItems() {
    var cat = INCENTIVE_CATS[currentCat];
    var section = document.getElementById('subitemSection');
    section.style.display = 'block';

    var html = '<div class="subitem-header">'+
      '<span class="cbadge '+cat.cls+'">'+cat.id+'</span>'+
      '<span style="font-weight:400;color:#8c8c8c;font-size:13px;">— 选择子项上传文件</span></div>';

    cat.subs.forEach(function(sub, si) {
      html += '<div class="sub-group">'+
        '<div class="sub-group-hd"><span class="dot '+cat.cls+'"></span>'+sub.name+'</div>';
      sub.tiers.forEach(function(tier, ti) {
        html += '<div class="subitem-row">'+
          '<div class="subitem-name">'+tier.label+'</div>'+
          '<div class="subitem-pts" style="background:'+ptsClass(tier.pts)+'15;color:'+ptsClass(tier.pts)+';">'+tier.pts+'分</div>'+
          '<button class="subitem-btn" onclick="uploadFile('+currentCat+','+si+','+ti+')">'+
            '<i data-lucide="upload" style="width:14px;height:14px;"></i> 上传文件</button>'+
          '</div>';
      });
      html += '</div>';
    });
    section.innerHTML = html;
  }

  function renderFiles() {
    var person = document.getElementById('selPerson').value;
    var period = document.getElementById('selPeriod').value;
    var allFiles = getFiles(person, period);
    var catFiles = allFiles.filter(function(f){ return f.catIdx === currentCat; });
    catFiles.sort(function(a,b){ return a.uploadDate > b.uploadDate ? -1 : 1; });

    document.getElementById('fileCount').textContent = catFiles.length + ' 个文件';
    var area = document.getElementById('fileListArea');
    if(!catFiles.length) { area.innerHTML = '<div class="file-empty">暂无已上传文件</div>'; return; }

    var html = '<table style="table-layout:fixed;" class="file-table"><thead><tr>'+
      '<th>文件名</th><th style="width:72px;">大小</th><th style="width:110px;">子项</th><th style="width:110px;">关联客户</th><th style="width:96px;">上传日期</th><th style="width:48px;">操作</th>'+
      '</tr></thead><tbody>';
    catFiles.forEach(function(f){
      var sizeStr = f.fileSize > 1048576 ? (f.fileSize/1048576).toFixed(1)+'MB'
        : f.fileSize > 1024 ? (f.fileSize/1024).toFixed(0)+'KB' : f.fileSize+'B';
      var cat = INCENTIVE_CATS[f.catIdx];
      var sub = cat && cat.subs[f.subIdx];
      var tier = sub && sub.tiers[f.tierIdx];
      var displayName = (sub?sub.name:'') + ' · ' + (tier?tier.label:'');
      html += '<tr>'+
        '<td><i data-lucide="file" class="file-icon" style="width:14px;height:14px;"></i>'+escapeHtml(f.fileName||'')+'</td>'+
        '<td class="file-size">'+sizeStr+'</td>'+
        '<td class="file-subitem">'+escapeHtml(displayName)+'</td>'+
        '<td class="file-subitem" style="color:#1890ff;">'+escapeHtml(f.clientName||'—')+'</td>'+
        '<td class="file-date">'+f.uploadDate+'</td>'+
        '<td><button class="file-del-btn" onclick="deleteFile(\''+f.id+'\')" title="删除"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button></td>'+
        '</tr>';
    });
    html += '</tbody></table>';
    area.innerHTML = html;
  }

  function escapeHtml(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(function(){el.classList.remove('show')},2000);}

  lucide.createIcons();
  renderAll();

  function toggleOrgSub(el) {
    var sub = document.getElementById('orgSub');
    var arrow = el.querySelector('.sub-arrow');
    if (!sub) return;
    sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
    if (arrow) arrow.style.transform = sub.style.display === 'block' ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
  function toggleScoreSub(el) {
    var sub = document.getElementById('scoreSub');
    if (!sub) return;
    sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
    var arrow = el.querySelector('.sub-arrow');
    if (arrow) arrow.style.transform = sub.style.display === 'block' ? 'rotate(0deg)' : 'rotate(-90deg)';
  }
</script>
</body>
</html>
