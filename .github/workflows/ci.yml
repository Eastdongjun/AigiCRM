name: CI

on:
  schedule:
    - cron: '0 21 * * *'  # 【N3】每日 05:00(北京时间) 带凭据跑文件权限端到端五段钉
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven verify (含 ArchUnit 分层约束)
        working-directory: 02-迭代源代码/aigicrm-backend
        run: mvn -B -q verify
      # 【B2 修复 2026-11-12】jar 上传 artifact——boot-smoke 依赖 backend-jar(原缺 upload 必挂)
      - name: 上传 jar 产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: 02-迭代源代码/aigicrm-backend/target/*.jar
          retention-days: 7
      # aigicrm_database_test.sql 是本地生成的数据库 dump(含业务数据, .gitignore 排除),
      # fresh checkout 无此文件 → 有文件才跑真实 cross-check, 否则跳过(此前固定引用导致 CI 必败)
      - name: Cross-check schema vs entity
        run: |
          if [ -f aigicrm_database_test.sql ]; then
            python3 02-迭代源代码/scripts/check_schema_entity.py --java-dir 02-迭代源代码/aigicrm-backend/src/main/java --sql aigicrm_database_test.sql
          else
            echo "⚠️ aigicrm_database_test.sql 未提交(gitignored)——跳过; 本地生成 dump 后自动执行该检查"
          fi
      - name: Cross-check api wiring
        run: python3 02-迭代源代码/scripts/check_api_wiring.py --frontend-api 02-迭代源代码/aigicrm-ui/src/api --backend 02-迭代源代码/aigicrm-backend/src/main/java
      - name: Cross-check permission strings
        run: |
          if [ -f aigicrm_database_test.sql ]; then
            python3 02-迭代源代码/scripts/check_permission_strings.py --backend 02-迭代源代码/aigicrm-backend/src/main/java --sql aigicrm_database_test.sql
          else
            echo "⚠️ aigicrm_database_test.sql 未提交(gitignored)——跳过; 本地生成 dump 后自动执行该检查"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm ci
      - name: Build
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm run build
      - name: Test (vitest)
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm run test -- --run

  # 【2026-10-07 补】小程序全量语法检查（原生项目无 lint/单测，node --check 是唯一机器门禁）
  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check 全量
        run: |
          set -e
          cd "02-迭代源代码/aigicrm-miniprogram"
          # 【IL1·2026-10-08 审查修复】排除模式改为任意层级——旧 "./node_modules/*" 只匹配
          # 顶层目录，日后装依赖时嵌套 node_modules/miniprogram_npm 会被语法检查误扫
          find . -name "*.js" -not -path "*/node_modules/*" -not -path "*/miniprogram_npm/*" -print0 | xargs -0 -n1 node --check
          echo "全部 js 语法通过"

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    outputs:
      ran: ${{ steps.sonar-token.outputs.ran }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Sonar token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SONAR_TOKEN 未配置——跳过 SonarCloud 上传; Quality Gate 保持未计算"
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SonarCloud scan
        if: steps.sonar-token.outputs.ran == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx --yes sonar-scanner \
            -Dsonar.scanner.skipJreProvisioning=true \
            -Dsonar.ws.timeout=300 \
            -Dsonar.qualitygate.wait=true

  # P0 质量门禁（2026-08-12）：修改范围空白检查 + 密钥粗检（PR 相对基准 / push 相对父提交）
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="HEAD^"
          fi
          git diff --check "$base"...HEAD
      - name: 变更文件密钥粗检
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="HEAD^"
          fi
          files=$(git diff --name-only "$base"...HEAD | grep -E '\.(java|js|ts|vue|py|sh|yaml|yml|json)$' || true)
          bad=0
          for f in $files; do
            if grep -nE "password\s*[:=]\s*['\"][^'\"]{6,}['\"]" "$f" 2>/dev/null; then
              echo "❌ 疑似硬编码密码: $f"; bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "✅ 无硬编码密码" || exit 1

  # 【检查体系四轴 2026-11-11】启动冒烟(评估点名的休眠资产转正第三件):
  # backend job 构建出的 jar 在 mysql+redis service 上真实启动——健康检查 + 权限探针
  # (无 token 401 / 错 token 401), "上下文能起"从推断变证据。库用空库重放同款集灌入。
  boot-smoke:
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: smoke-root
          MYSQL_DATABASE: ycmn
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=30
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_general_ci
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      # 【B2 修复 2026-11-12】runner 默认 JDK 17 跑不动 Java 21 字节码(UnsupportedClassVersionError)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 取 backend 构建的 jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: /tmp/jar
      - name: 灌库(空库重放集, V1+V12~V33+日期版)
        run: |
          mkdir -p /tmp/smoke-mig
          find 02-迭代源代码/aigicrm-backend/src/main/resources/db/migration -maxdepth 1 -name '*.sql' \
            ! -name 'V[2-9]__*' ! -name 'V10__*' ! -name 'V11__*' -exec cp {} /tmp/smoke-mig/ \;
          docker run --rm --network host -v /tmp/smoke-mig:/flyway/sql flyway/flyway:9.22.3-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/ycmn?characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=false&allowPublicKeyRetrieval=true" \
            -user=root -password=smoke-root -connectRetries=30 -validateMigrationNaming=true migrate 2>&1 | tail -3
      - name: 启动应用并探活
        run: |
          JAR=$(ls /tmp/jar/*.jar | head -1)
          echo "启动 $JAR"
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=ycmn DB_USER=root DB_PASSWORD=smoke-root \
          REDIS_HOST=127.0.0.1 REDIS_PORT=6379 JWT_SECRET=boot-smoke-secret-key-for-ci-only-32chars \
          STORAGE_TYPE=local TZ=Asia/Shanghai java -jar "$JAR" > /tmp/boot.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8080/actuator/health || { echo '❌ 健康检查失败'; tail -40 /tmp/boot.log; kill $APP_PID; exit 1; }
          echo "== 权限探针 =="
          CODE1=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/customer/list)
          CODE2=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid-token' http://127.0.0.1:8080/api/customer/list)
          echo "无token=$CODE1(预期401) 错token=$CODE2(预期401)"
          [ "$CODE1" = "401" ] && [ "$CODE2" = "401" ] || { echo '❌ 认证语义探针失败'; tail -20 /tmp/boot.log; kill $APP_PID; exit 1; }
          kill $APP_PID

  # 【检查体系四轴 2026-11-11】依赖安全扫描(L1 供应链缺口): osv-scanner 扫 Maven(pom 直扫)
  # + package-lock, 另跑 npm audit high。发现漏洞即红(带修复指引), 治理决策归人。
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: 安装 osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
      - name: 扫描 Maven + 前端锁文件
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # 【B2 修复 2026-11-12】路径补 02-迭代源代码/ 前缀; 去 `|| true` 假绿——
          # scanner 执行失败(rc≥2, 安装/网络/参数)必须红, 只有"扫出漏洞"(rc=1)留给下方 grep 判级
          rc_sum=0
          osv-scanner --lockfile=02-迭代源代码/aigicrm-ui/package-lock.json > /tmp/osv-frontend.log 2>&1 || rc=$?
          rc_sum=$((rc_sum + ${rc:-0})); unset rc
          osv-scanner --lockfile=02-迭代源代码/aigicrm-backend/pom.xml > /tmp/osv-maven.log 2>&1 || rc=$?
          rc_sum=$((rc_sum + ${rc:-0})); unset rc
          echo "== 前端漏洞 =="; cat /tmp/osv-frontend.log
          echo "== Maven 漏洞 =="; cat /tmp/osv-maven.log
          # scanner 自身失败(任一侧 rc≥2)即红, 不静默假绿
          if [ "$rc_sum" -ge 2 ]; then
            echo '❌ osv-scanner 执行失败(非"无漏洞")——不允许静默通过'; exit 1
          fi
          # 红线: 任意 high 及以上漏洞
          if grep -qE "([0-9]+ (High|Critical) vulnerabilities|Severity: (High|Critical))" /tmp/osv-frontend.log /tmp/osv-maven.log; then
            echo '❌ 发现 High/Critical 级依赖漏洞'; exit 1
          fi
      - name: npm audit (high+)
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm audit --audit-level=high --omit=dev > /tmp/audit.log 2>&1; cat /tmp/audit.log; ! grep -qE "[1-9][0-9]* (high|critical)" /tmp/audit.log

  # 【底座评估 2026-11-11】空库 Flyway 重放 + 权限末态断言(评估建议 P2):
  # 不依赖测试服——runner 内起 mysql:8.0 service(按生产参数 general_ci), 重放集与
  # scripts/replay-empty-db.sh 同口径(V1+V12~V33+日期版, 排除 V2~V11), 末态断言
  # 8 审计码绑定全覆盖。本地另有 replay-empty-db.sh 走测试服一次性容器(可手动跑)。
  empty-db-replay:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: replay-root
          MYSQL_DATABASE: ycmn
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=30
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_general_ci
    steps:
      - uses: actions/checkout@v4
      - name: 打包空库重放集(仅排 V2~V11, 与 replay-empty-db.sh 同口径)
        run: |
          mkdir -p /tmp/replay-mig
          find 02-迭代源代码/aigicrm-backend/src/main/resources/db/migration -maxdepth 1 -name '*.sql' \
            ! -name 'V[2-9]__*' ! -name 'V10__*' ! -name 'V11__*' -exec cp {} /tmp/replay-mig/ \;
          echo "重放集: $(ls /tmp/replay-mig/*.sql | wc -l) 个"
      - name: Flyway 全链重放
        run: |
          docker run --rm --network host -v /tmp/replay-mig:/flyway/sql flyway/flyway:9.22.3-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/ycmn?characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=false&allowPublicKeyRetrieval=true" \
            -user=root -password=replay-root -connectRetries=30 -validateMigrationNaming=true migrate 2>&1 | tail -6
      - name: 末态断言(码清单单一源, 0 failed)
        run: |
          # 【N7】断言码读 scripts/empty-replay-codes.txt(与 scripts/replay-empty-db.sh 共用单一源)
          # 【B2 修复 2026-11-12】路径补 02-迭代源代码/ 前缀(checkout 根≠源码根, 原相对路径必败)
          CODES_IN=$(grep -vE '^#|^$' 02-迭代源代码/scripts/empty-replay-codes.txt | awk "{printf \"'%s',\", \$1}" | sed 's/,$//')
          TOTAL=$(grep -cE '^[a-z]' 02-迭代源代码/scripts/empty-replay-codes.txt)
          echo "断言码 $TOTAL 个: $CODES_IN"
          docker run --rm --network host mysql:8.0 mysql -h127.0.0.1 -P3306 -uroot -preplay-root ycmn -N -e "
            SELECT IF(COUNT(*)=0,'flyway_failed=0','HAS_FAILED') FROM flyway_schema_history WHERE success<>1;
            SELECT m.permission, m.status, COUNT(rm.role_id) FROM sys_menu m
            LEFT JOIN sys_role_menu rm ON rm.menu_id=m.id
            WHERE m.permission IN ($CODES_IN)
              AND m.menu_type=3 GROUP BY m.permission, m.status ORDER BY m.permission;"
          BAD=$(docker run --rm --network host mysql:8.0 mysql -h127.0.0.1 -P3306 -uroot -preplay-root ycmn -N -e "
            SELECT COUNT(*) FROM sys_menu m LEFT JOIN sys_role_menu rm ON rm.menu_id=m.id
            WHERE m.permission IN ($CODES_IN)
              AND m.menu_type=3 AND (m.status<>1 OR rm.id IS NULL);")
          ADMIN_N=$(docker run --rm --network host mysql:8.0 mysql -h127.0.0.1 -P3306 -uroot -preplay-root ycmn -N -e "
            SELECT COUNT(DISTINCT m.permission) FROM sys_role_menu rm
            JOIN sys_menu m ON m.id=rm.menu_id JOIN sys_role r ON r.id=rm.role_id
            WHERE r.role_code='admin' AND m.menu_type=3 AND m.permission IN ($CODES_IN);")
          echo "末态异常行: $BAD (预期 0) / admin 持码: $ADMIN_N/$TOTAL"
          [ "$BAD" = "0" ] && [ "$ADMIN_N" = "$TOTAL" ] || { echo '❌ 空库重放末态断言失败'; exit 1; }

  # 【N3 2026-11-11 审计整改】文件权限端到端钉的定时真跑:
  # 治本④ 的五段闭环(勾→双端出→操作放行→收回复位)默认休眠(离线/CI push 不假红),
  # 只在 schedule 事件带 secrets 真实执行——钉子只在真跑时才有防线价值。
  # 需配置 secrets: PERM_E2E_BASE/USER/PASS/UID/FOLDER + HEALTH_CHECK_USER/PASS。
  file-perm-e2e:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 文件权限端到端五段钉(测试环境)
        env:
          AIGI_PERM_E2E: '1'
          PERM_E2E_BASE: ${{ secrets.PERM_E2E_BASE }}
          PERM_E2E_USER: ${{ secrets.PERM_E2E_USER }}
          PERM_E2E_PASS: ${{ secrets.PERM_E2E_PASS }}
          PERM_E2E_UID: ${{ secrets.PERM_E2E_UID }}
          PERM_E2E_FOLDER: ${{ secrets.PERM_E2E_FOLDER }}
          HEALTH_CHECK_USER: ${{ secrets.HEALTH_CHECK_USER }}
          HEALTH_CHECK_PASS: ${{ secrets.HEALTH_CHECK_PASS }}
        run: bash scripts/check-file-perm-e2e.sh

  # P0 汇总门禁：作为 GitHub 分支保护可要求的必过 job
  # 【B2 修复 2026-11-12】本地契约全集(dev-verify contracts, 168+ 检查)纳入 CI 合并门禁——
  # 此前只在本地 gate 跑, "CI 绿=质量绿"不成立。依赖 rg(多数 check-* 契约使用)。
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装契约依赖(ripgrep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: 本地契约全集(dev-verify.sh contracts)
        working-directory: 02-迭代源代码
        run: bash scripts/dev-verify.sh contracts

  quality-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend, miniprogram, sonarcloud, diff-check, file-perm-e2e, empty-db-replay, boot-smoke, osv-scan, contracts]
    if: always()
    steps:
      - run: |
          echo "════════ 质量门禁汇总 ════════"
          echo "backend      : ${{ needs.backend.result }}"
          echo "frontend     : ${{ needs.frontend.result }}"
          echo "miniprogram  : ${{ needs.miniprogram.result }}"
          echo "sonarcloud   : ${{ needs.sonarcloud.result }}"
          echo "sonar-ran    : ${{ needs.sonarcloud.outputs.ran }}"
          echo "diff-check   : ${{ needs.diff-check.result }}"
          echo "contracts    : ${{ needs.contracts.result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.contracts.result }}" = "success"
          test "${{ needs.miniprogram.result }}" = "success"
          if [ "${{ needs.sonarcloud.outputs.ran }}" = "true" ]; then
            test "${{ needs.sonarcloud.result }}" = "success"
          else
            # 【T9 2026-11-11 审计整改 P1-10】Sonar 缺失不再静默成功: 此前仅 echo 警告,
            # job 仍 success——"跑过 Sonar"与"没跑 Sonar"在门禁汇总里不可区分。
            # 未配置 SONAR_TOKEN = 质量门禁不完整 = 红。修复: 仓库 Settings→Secrets→Actions
            # 配置 SONAR_TOKEN(SonarCloud 项目令牌)。
            echo "❌ SonarCloud 未运行：缺少 SONAR_TOKEN —— Quality Gate 拒绝通过(非警告)"
            echo "   修复: 仓库 Settings → Secrets and variables → Actions → 配置 SONAR_TOKEN"
            exit 1
          fi
          test "${{ needs.diff-check.result }}" = "success"
          # 【N3】e2e 钉只在 schedule 事件运行; 该事件下其失败必须挡门禁(push/PR 跳过不判)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            test "${{ needs['file-perm-e2e'].result }}" = "success"
          fi
          # 【底座评估】空库重放不依赖 secrets, 全事件强制
          test "${{ needs['empty-db-replay'].result }}" = "success"
          # 【检查体系四轴】启动冒烟/依赖扫描同样全事件强制
          test "${{ needs['boot-smoke'].result }}" = "success"
          test "${{ needs['osv-scan'].result }}" = "success"
