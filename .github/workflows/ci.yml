name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven verify (含 ArchUnit 分层约束)
        working-directory: ycmn-backend
        run: mvn -B -q verify
      - name: Cross-check schema vs entity
        run: python3 scripts/check_schema_entity.py --java-dir ycmn-backend/src/main/java --sql ycmn_database_test.sql
      - name: Cross-check api wiring
        run: python3 scripts/check_api_wiring.py --frontend-api ycmn-ui/src/api --backend ycmn-backend/src/main/java
      - name: Cross-check permission strings
        run: python3 scripts/check_permission_strings.py --backend ycmn-backend/src/main/java --sql ycmn_database_test.sql

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ycmn-ui
        run: npm ci
      - name: Build
        working-directory: ycmn-ui
        run: npm run build
      - name: Test (vitest)
        working-directory: ycmn-ui
        run: npm run test -- --run
