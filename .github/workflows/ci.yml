name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven verify (含 ArchUnit 分层约束)
        working-directory: ycmn-backend
        run: mvn -B -q verify
      # ycmn_database_test.sql 是本地生成的数据库 dump(含业务数据, .gitignore 排除),
      # fresh checkout 无此文件 → 有文件才跑真实 cross-check, 否则跳过(此前固定引用导致 CI 必败)
      - name: Cross-check schema vs entity
        run: |
          if [ -f ycmn_database_test.sql ]; then
            python3 scripts/check_schema_entity.py --java-dir ycmn-backend/src/main/java --sql ycmn_database_test.sql
          else
            echo "⚠️ ycmn_database_test.sql 未提交(gitignored)——跳过; 本地生成 dump 后自动执行该检查"
          fi
      - name: Cross-check api wiring
        run: python3 scripts/check_api_wiring.py --frontend-api ycmn-ui/src/api --backend ycmn-backend/src/main/java
      - name: Cross-check permission strings
        run: |
          if [ -f ycmn_database_test.sql ]; then
            python3 scripts/check_permission_strings.py --backend ycmn-backend/src/main/java --sql ycmn_database_test.sql
          else
            echo "⚠️ ycmn_database_test.sql 未提交(gitignored)——跳过; 本地生成 dump 后自动执行该检查"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ycmn-ui
        run: npm ci
      - name: Build
        working-directory: ycmn-ui
        run: npm run build
      - name: Test (vitest)
        working-directory: ycmn-ui
        run: npm run test -- --run

  # P0 质量门禁（2026-08-12）：修改范围空白检查 + 密钥粗检（PR 相对基准 / push 相对父提交）
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="HEAD^"
          fi
          git diff --check "$base"...HEAD
      - name: 变更文件密钥粗检
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="HEAD^"
          fi
          files=$(git diff --name-only "$base"...HEAD | grep -E '\.(java|js|ts|vue|py|sh|yaml|yml|json)$' || true)
          bad=0
          for f in $files; do
            if grep -nE "password\s*[:=]\s*['\"][^'\"]{6,}['\"]" "$f" 2>/dev/null; then
              echo "❌ 疑似硬编码密码: $f"; bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "✅ 无硬编码密码" || exit 1

  # P0 汇总门禁：作为 GitHub 分支保护可要求的必过 job
  quality-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend, diff-check]
    if: always()
    steps:
      - run: |
          echo "════════ 质量门禁汇总 ════════"
          echo "backend      : ${{ needs.backend.result }}"
          echo "frontend     : ${{ needs.frontend.result }}"
          echo "diff-check   : ${{ needs.diff-check.result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.diff-check.result }}" = "success"
