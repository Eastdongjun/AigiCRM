name: CI

on:
  schedule:
    - cron: '0 21 * * *'  # 【N3】每日 05:00(北京时间) 带凭据跑文件权限端到端五段钉
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maven verify (含 ArchUnit 分层约束)
        working-directory: 02-迭代源代码/aigicrm-backend
        run: mvn -B -q verify
      # aigicrm_database_test.sql 是本地生成的数据库 dump(含业务数据, .gitignore 排除),
      # fresh checkout 无此文件 → 有文件才跑真实 cross-check, 否则跳过(此前固定引用导致 CI 必败)
      - name: Cross-check schema vs entity
        run: |
          if [ -f aigicrm_database_test.sql ]; then
            python3 02-迭代源代码/scripts/check_schema_entity.py --java-dir 02-迭代源代码/aigicrm-backend/src/main/java --sql aigicrm_database_test.sql
          else
            echo "⚠️ aigicrm_database_test.sql 未提交(gitignored)——跳过; 本地生成 dump 后自动执行该检查"
          fi
      - name: Cross-check api wiring
        run: python3 02-迭代源代码/scripts/check_api_wiring.py --frontend-api 02-迭代源代码/aigicrm-ui/src/api --backend 02-迭代源代码/aigicrm-backend/src/main/java
      - name: Cross-check permission strings
        run: |
          if [ -f aigicrm_database_test.sql ]; then
            python3 02-迭代源代码/scripts/check_permission_strings.py --backend 02-迭代源代码/aigicrm-backend/src/main/java --sql aigicrm_database_test.sql
          else
            echo "⚠️ aigicrm_database_test.sql 未提交(gitignored)——跳过; 本地生成 dump 后自动执行该检查"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm ci
      - name: Build
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm run build
      - name: Test (vitest)
        working-directory: 02-迭代源代码/aigicrm-ui
        run: npm run test -- --run

  # 【2026-10-07 补】小程序全量语法检查（原生项目无 lint/单测，node --check 是唯一机器门禁）
  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check 全量
        run: |
          set -e
          cd "02-迭代源代码/aigicrm-miniprogram"
          # 【IL1·2026-10-08 审查修复】排除模式改为任意层级——旧 "./node_modules/*" 只匹配
          # 顶层目录，日后装依赖时嵌套 node_modules/miniprogram_npm 会被语法检查误扫
          find . -name "*.js" -not -path "*/node_modules/*" -not -path "*/miniprogram_npm/*" -print0 | xargs -0 -n1 node --check
          echo "全部 js 语法通过"

  sonarcloud:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    outputs:
      ran: ${{ steps.sonar-token.outputs.ran }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Sonar token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SONAR_TOKEN 未配置——跳过 SonarCloud 上传; Quality Gate 保持未计算"
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SonarCloud scan
        if: steps.sonar-token.outputs.ran == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          npx --yes sonar-scanner \
            -Dsonar.scanner.skipJreProvisioning=true \
            -Dsonar.ws.timeout=300 \
            -Dsonar.qualitygate.wait=true

  # P0 质量门禁（2026-08-12）：修改范围空白检查 + 密钥粗检（PR 相对基准 / push 相对父提交）
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="HEAD^"
          fi
          git diff --check "$base"...HEAD
      - name: 变更文件密钥粗检
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="HEAD^"
          fi
          files=$(git diff --name-only "$base"...HEAD | grep -E '\.(java|js|ts|vue|py|sh|yaml|yml|json)$' || true)
          bad=0
          for f in $files; do
            if grep -nE "password\s*[:=]\s*['\"][^'\"]{6,}['\"]" "$f" 2>/dev/null; then
              echo "❌ 疑似硬编码密码: $f"; bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "✅ 无硬编码密码" || exit 1

  # 【底座评估 2026-11-11】空库 Flyway 重放 + 权限末态断言(评估建议 P2):
  # 不依赖测试服——runner 内起 mysql:8.0 service(按生产参数 general_ci), 重放集与
  # scripts/replay-empty-db.sh 同口径(V1+V12~V33+日期版, 排除 V2~V11), 末态断言
  # 8 审计码绑定全覆盖。本地另有 replay-empty-db.sh 走测试服一次性容器(可手动跑)。
  empty-db-replay:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: replay-root
          MYSQL_DATABASE: ycmn
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=30
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_general_ci
    steps:
      - uses: actions/checkout@v4
      - name: 打包空库重放集(仅排 V2~V11, 与 replay-empty-db.sh 同口径)
        run: |
          mkdir -p /tmp/replay-mig
          find aigicrm-backend/src/main/resources/db/migration -maxdepth 1 -name '*.sql' \
            ! -name 'V[2-9]__*' ! -name 'V10__*' ! -name 'V11__*' -exec cp {} /tmp/replay-mig/ \;
          echo "重放集: $(ls /tmp/replay-mig/*.sql | wc -l) 个"
      - name: Flyway 全链重放
        run: |
          docker run --rm --network host -v /tmp/replay-mig:/flyway/sql flyway/flyway:9.22.3-alpine \
            -url="jdbc:mysql://127.0.0.1:3306/ycmn?characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=false&allowPublicKeyRetrieval=true" \
            -user=root -password=replay-root -connectRetries=30 -validateMigrationNaming=true migrate 2>&1 | tail -6
      - name: 末态断言(8 审计码绑定全覆盖, 0 failed)
        run: |
          docker run --rm --network host mysql:8.0 mysql -h127.0.0.1 -P3306 -uroot -preplay-root ycmn -N -e "
            SELECT IF(COUNT(*)=0,'flyway_failed=0','HAS_FAILED') FROM flyway_schema_history WHERE success<>1;
            SELECT m.permission, m.status, COUNT(rm.role_id) FROM sys_menu m
            LEFT JOIN sys_role_menu rm ON rm.menu_id=m.id
            WHERE m.permission IN ('file:upload','file:edit','file:delete','file:share','file:folder:manage','finance:manage','customer:finance:edit','customer:invoice-date:edit')
              AND m.menu_type=3 GROUP BY m.permission, m.status ORDER BY m.permission;"
          BAD=$(docker run --rm --network host mysql:8.0 mysql -h127.0.0.1 -P3306 -uroot -preplay-root ycmn -N -e "
            SELECT COUNT(*) FROM sys_menu m LEFT JOIN sys_role_menu rm ON rm.menu_id=m.id
            WHERE m.permission IN ('file:upload','file:edit','file:delete','file:share','file:folder:manage','finance:manage','customer:finance:edit','customer:invoice-date:edit')
              AND m.menu_type=3 AND (m.status<>1 OR rm.id IS NULL);")
          echo "末态异常行: $BAD (预期 0)"
          [ "$BAD" = "0" ] || { echo '❌ 空库重放末态断言失败'; exit 1; }

  # 【N3 2026-11-11 审计整改】文件权限端到端钉的定时真跑:
  # 治本④ 的五段闭环(勾→双端出→操作放行→收回复位)默认休眠(离线/CI push 不假红),
  # 只在 schedule 事件带 secrets 真实执行——钉子只在真跑时才有防线价值。
  # 需配置 secrets: PERM_E2E_BASE/USER/PASS/UID/FOLDER + HEALTH_CHECK_USER/PASS。
  file-perm-e2e:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 文件权限端到端五段钉(测试环境)
        env:
          AIGI_PERM_E2E: '1'
          PERM_E2E_BASE: ${{ secrets.PERM_E2E_BASE }}
          PERM_E2E_USER: ${{ secrets.PERM_E2E_USER }}
          PERM_E2E_PASS: ${{ secrets.PERM_E2E_PASS }}
          PERM_E2E_UID: ${{ secrets.PERM_E2E_UID }}
          PERM_E2E_FOLDER: ${{ secrets.PERM_E2E_FOLDER }}
          HEALTH_CHECK_USER: ${{ secrets.HEALTH_CHECK_USER }}
          HEALTH_CHECK_PASS: ${{ secrets.HEALTH_CHECK_PASS }}
        run: bash scripts/check-file-perm-e2e.sh

  # P0 汇总门禁：作为 GitHub 分支保护可要求的必过 job
  quality-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend, miniprogram, sonarcloud, diff-check, file-perm-e2e, empty-db-replay]
    if: always()
    steps:
      - run: |
          echo "════════ 质量门禁汇总 ════════"
          echo "backend      : ${{ needs.backend.result }}"
          echo "frontend     : ${{ needs.frontend.result }}"
          echo "miniprogram  : ${{ needs.miniprogram.result }}"
          echo "sonarcloud   : ${{ needs.sonarcloud.result }}"
          echo "sonar-ran    : ${{ needs.sonarcloud.outputs.ran }}"
          echo "diff-check   : ${{ needs.diff-check.result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.miniprogram.result }}" = "success"
          if [ "${{ needs.sonarcloud.outputs.ran }}" = "true" ]; then
            test "${{ needs.sonarcloud.result }}" = "success"
          else
            # 【T9 2026-11-11 审计整改 P1-10】Sonar 缺失不再静默成功: 此前仅 echo 警告,
            # job 仍 success——"跑过 Sonar"与"没跑 Sonar"在门禁汇总里不可区分。
            # 未配置 SONAR_TOKEN = 质量门禁不完整 = 红。修复: 仓库 Settings→Secrets→Actions
            # 配置 SONAR_TOKEN(SonarCloud 项目令牌)。
            echo "❌ SonarCloud 未运行：缺少 SONAR_TOKEN —— Quality Gate 拒绝通过(非警告)"
            echo "   修复: 仓库 Settings → Secrets and variables → Actions → 配置 SONAR_TOKEN"
            exit 1
          fi
          test "${{ needs.diff-check.result }}" = "success"
          # 【N3】e2e 钉只在 schedule 事件运行; 该事件下其失败必须挡门禁(push/PR 跳过不判)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            test "${{ needs['file-perm-e2e'].result }}" = "success"
          fi
          # 【底座评估】空库重放不依赖 secrets, 全事件强制
          test "${{ needs['empty-db-replay'].result }}" = "success"
