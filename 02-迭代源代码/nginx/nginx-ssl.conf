# ⚠️ 本文件是 **模板**，不是可直接使用的 nginx 配置。
# 其中的 ${BACKEND_HOST} 由官方 nginx 镜像的 entrypoint（/docker-entrypoint.d/20-envsubst-on-templates.sh）
# 在容器启动时用环境变量替换，生成 /etc/nginx/conf.d/default.conf。
# 因此必须挂载到 /etc/nginx/templates/default.conf.template（见 docker-compose.yml / docker-compose.prod.yml），
# 而**不要**直接挂/拷到 /etc/nginx/conf.d/default.conf —— 那样 ${BACKEND_HOST} 不会被替换，
# nginx 会以 `[emerg] host not found in upstream "${BACKEND_HOST}"` 启动失败（实测退出码 1）。
# BACKEND_HOST 由 compose 按 APP_SLUG 注入：${APP_SLUG:-aigicrm}-backend

# 【file-4 2026-10-17】下载 token 走 query string（...?token=<jwt>），默认 combined 日志的
# $request 会把完整 URL（含 token）明文写进 access.log。这里在 http 层生成脱敏副本
# $request_redacted：把 token 参数值替换为 ***，其余 URL 原样保留；访问日志只用该变量。
# 注意：不改写 $request_uri / 不碰请求本身，Range 下载与后端鉴权行为完全不变。
#
# 【D7 2026-10-21 审计修复】旧正则 `.*[?&]token=` 是**贪婪**匹配：一个请求带多个 token= 时
# 只把**最后一个**替换为 ***，前面的 JWT 仍明文写入 access.log（nginx 1.25-alpine 实测）。
# 纯 nginx（无 js/lua）无法一次做全局替换，改用**链式 map**逐个脱敏：每级用非贪婪 `.*?`
# 定位**第一个** token=，负向前瞻 (?!\*\*\*) 跳过已脱敏的，故下一级能命中再下一个 token。
# 三级覆盖单 URL 最多 3 个 token；第 4 级兜底——若仍残留未脱敏 token（≥4 个，病态/攻击形态），
# 整个 query 不再入日志（宁可丢日志信息，不可泄 JWT）。双 token 用例由
# scripts/check-nginx-token-redaction.sh 守护。
map $request $req_redact_1 {
    default $request;
    "~^(?<pre1>.*?[?&]token=)(?!\*\*\*)[^&\s]*(?<post1>.*)$" $pre1***$post1;
}
map $req_redact_1 $req_redact_2 {
    default $req_redact_1;
    "~^(?<pre2>.*?[?&]token=)(?!\*\*\*)[^&\s]*(?<post2>.*)$" $pre2***$post2;
}
map $req_redact_2 $req_redact_3 {
    default $req_redact_2;
    "~^(?<pre3>.*?[?&]token=)(?!\*\*\*)[^&\s]*(?<post3>.*)$" $pre3***$post3;
}
map $req_redact_3 $request_redacted {
    default $req_redact_3;
    # 兜底：三级后仍含未脱敏 token= 值 → 丢弃整个 query（保留方法与路径），绝不输出残余 JWT
    "~^(?<guard_pre>.*?\?).*[?&]token=(?!\*\*\*)[^&\s].*$" ${guard_pre}token=***&more-redacted;
}
# 【P0-5 2026-11-12 GoLive 审计 FE-PC-003/MINI-001】$http_referer 脱敏——
# web-view 子资源请求的 Referer 头携带主 JWT 查询串 → 落 access.log 泄漏会话 token;
# 同款三级 map 脱敏(复用 request_redacted 的模式), 无法脱净时丢弃 query 保 origin+path。
map $http_referer $referer_redacted {
    default $http_referer;
    "~^(?<ref_pre>.*?)[?&]token=[^&\s]+" ${ref_pre}?token=***;
    "~i^(?<ref_pre2>.*?)[?&](token|jwt|auth)=[^&\s]+" ${ref_pre2}?token=***;
    "~^(?<ref_guard>https?://[^/?]+/[^?]*)" $ref_guard;
}
log_format aigicrm_redacted '$remote_addr - $remote_user [$time_local] "$request_redacted" '
                             '$status $body_bytes_sent "$referer_redacted" '
                             '"$http_user_agent" "$http_x_forwarded_for"';

# 【容量加固 2026-10-05】后端 upstream 长连接池：
# keepalive 32 使 nginx→后端复用 TCP 连接，免去每请求一次三次握手 + Tomcat accept/建连开销；
# 生效前提：proxy_pass 指向本 upstream + proxy_http_version 1.1 + proxy_set_header Connection ""
upstream backend_pool {
    server ${BACKEND_HOST}:8080;
    keepalive 32;
}

# 【容量加固 2026-10-05】API 兜底限流（limit_req_zone 属 http 上下文指令，本文件经
# templates/default.conf.template envsubst 生成 conf.d/default.conf，位于 conf.d 顶层即 http{} 内，合法）：
# - $binary_remote_addr：nginx 即边缘入口（80/443 直暴），remote_addr 即真实客户端 IP
# - rate=30r/s + burst=60 nodelay：先宽后紧的兜底定位——远超正常业务峰值，仅拦截
#   单一异常客户端/脚本以满并发打满 Tomcat 200 线程拖垮全站的场景；正常用户无感
# - 10m 共享区约可记录 16 万 IP 状态，当前用户量远用不完；后续按实测流量逐步收紧
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# HTTP：全部跳转到 HTTPS（统一 www 域名）
server {
    listen 80;
    server_name www.aigicrm.com aigicrm.com;
    access_log /var/log/nginx/access.log aigicrm_redacted;
    return 301 https://www.aigicrm.com$request_uri;
}

# HTTPS：非 www 域名统一 301 到 www（避免 CORS Origin 不匹配导致接口 403）
server {
    listen 443 ssl;
    http2 on;
    server_name aigicrm.com;
    access_log /var/log/nginx/access.log aigicrm_redacted;

    ssl_certificate     /etc/nginx/ssl/www.aigicrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aigicrm.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.aigicrm.com$request_uri;
}

# HTTPS：www 正式服务
server {
    listen 443 ssl;
    http2 on;
    server_name www.aigicrm.com;
    access_log /var/log/nginx/access.log aigicrm_redacted;

    ssl_certificate     /etc/nginx/ssl/www.aigicrm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/www.aigicrm.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # gzip 压缩:JSON/JS/CSS 文本压缩率高(215KB 客户列表 -> ~50KB),慢网络下响应时间减 4-6 倍
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # 安全响应头(FEAT-20260804-FILE-INTEGRITY)
    # CSP 2026-08-10: script-src 'self' 'unsafe-eval'(禁内联脚本——阻断存储型 XSS 的 inline script 载体;
    #   unsafe-eval 供 element-plus 全局对象 shim, 不放开 unsafe-inline);
    #   构建产物 index.html 仅外部脚本; style 'unsafe-inline' 供 element-plus 动态样式
    # frame-src 'self' blob: (2026-10-16 文件阅读器): PDF 预览把文件字节转成 blob URL 放进 <iframe> 交给浏览器
    #   内建阅读器; 此前无 frame-src 回落 default-src 'self' 拦掉 blob: 帧, 在线 PDF 预览一直是坏的。
    #   直链 iframe 不可行: /api/ 响应继承本 server 级 X-Frame-Options DENY。sandbox srcdoc 帧(表格/文本)不受影响。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口不缓存:部署后用户刷新即取最新 index.html,避免旧版引用已删除 chunk 导致页面异常
    # 注意:本 location 有自己的 add_header 后不再继承 server 级安全头,须在此补齐
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    # 图标请求兜底(前端 dist 有 favicon.png;apple-touch-icon 无则 204)
    location = /favicon.ico {
        try_files /favicon.png =204;
    }
    location = /apple-touch-icon.png { return 204; }
    location = /apple-touch-icon-precomposed.png { return 204; }

    # 【PDF 流式预览 2026-10-17】文件下载路径放行同源内嵌: 浏览器内建 PDF 阅读器直连此 URL,
    # 按 Range 分段边下边看(23.5MB PDF 首屏从全量下载完降到秒级)。XFO 收窄 DENY→SAMEORIGIN、
    # CSP frame-ancestors 收窄 none→self: 仅允许本系统页面内嵌, 外站仍被拒。
    # 注意 nginx add_header 不继承: 本 location 的安全头须整组重抄(除上述两处收窄外与 server 级一致)。
    # 与 ^~ /api/ 同款 upstream/超时/限流参数(最长前缀匹配优先命中本块)。
    location ^~ /api/file/download/ {
        proxy_pass http://backend_pool/api/file/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        limit_req zone=api_limit burst=60 nodelay;
        client_max_body_size 500m;
        # 后端 Spring Security 对所有响应自带 XFO DENY, 会与本块的 SAMEORIGIN 形成重复头(浏览器取最严=仍拒)——
        # 先隐掉上游的, 只保留下方 SAMEORIGIN
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
        # 【2026-10-27 深度检查修复】整组重抄时此前漏了 HSTS(注释自称与 server 级一致却少了这一条)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # API 代理（^~ 确保优先于下方静态资源正则匹配，否则 /api/.../*.png 等下载会被静态规则拦截导致 404）
    location ^~ /api/ {
        # 【容量加固 2026-10-05】改走上方 backend_pool upstream（长连接复用，见文件头部注释）
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【容量加固 2026-10-05】上游长连接三件套（缺一不可，否则 keepalive 不生效仍按短连接走）：
        proxy_http_version 1.1;          # HTTP/1.1 才支持持久连接（默认 proxy 是 1.0）
        proxy_set_header Connection "";  # 清空 Connection 头，避免逐请求传 close 破坏复用

        # 【容量加固 2026-10-05】超时显式钉住（nginx 默认 connect 60s / send 60s / read 60s）：
        # - connect 10s：后端不可达时快速失败，不让 nginx worker 挂满 60s 去等一个死连接
        # - send/read 60s：与默认一致显式钉住；500MB 大文件上传/下载走本代理，60s 传输窗
        #   对当前带宽充足（更长耗时的瓶颈在后端业务而非代理，且避免无限等挂住连接）
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 【容量加固 2026-10-05】兜底限流（zone 定义见文件头部）：30r/s + burst 60 nodelay，
        # 先宽后紧：正常页面一次加载 20-40 个请求也远低于 burst 容量，用户无感；
        # 超限返回 503，仅拦截异常高频客户端，防止打满后端线程池
        limit_req zone=api_limit burst=60 nodelay;

        # 文件上传大小限制
        client_max_body_size 500m;
    }

    # 静态资源缓存（含安全头，避免 server 级头被本 location 的 add_header 覆盖）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    }
}
