version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.28
    container_name: ${APP_SLUG:-aigicrm}-mysql
    restart: always
    environment:
      # 经部署 env 注入（DB_PASSWORD=已轮换的生产 root 密码，2026-08-08 后 123456 已失效）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置（经部署 env 注入，已轮换）}
      MYSQL_DATABASE: ${DB_NAME:-aigicrm}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # 【GPT复审 P1-01 修复 2026-09-21】对齐正式部署规范: 数据库 bind mount 到 /data/database,
      # 废弃 named volume(与 deploy 脚本/备份/迁移规范此前存在两套事实来源)
      - ${MYSQL_DATA_DIR:-/data/database/mysql-data}:/var/lib/mysql
      # ⚠️ 已注释（2026-09-12）：`./sql/init.sql` 在仓库中**不是文件，而是一个空目录**
      #    （该路径被 .gitignore:43-44 忽略；真种子只存在于备份
      #     08-备份索引/09-生产环境备份/deploy/ycmn/sql/init.sql）。
      #    挂载目录到 docker-entrypoint-initdb.d 会让 MySQL 官方入口脚本把目录当脚本处理，
      #    属于误配置。数据库初始化现已由 Flyway 链负责（含 V2026.09.11.6 的全新库种子）。
      #    新建空库时若确需该 legacy 种子文件，请先从备份恢复 ./sql/init.sql 再解除注释。
      # - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # 【容量加固 2026-10-05】MySQL 此前全默认（max_connections=151 / buffer_pool=128M / slow_log=OFF），显式调优：
    # - max-connections=300：覆盖后端 Hikari 池 30 连接(application.yml) + Flyway/备份/运维连接余量；
    #   151 默认值在多客户端与运维并发下有耗尽风险
    # - innodb-buffer-pool-size=536870912(512M)：生产宿主机总内存暂无证据
    #   (remote-inventory.txt 仅含磁盘/容器清单，无 free/meminfo)，按容量加固批任务规则取 512M 兜底
    #   ——较默认 128M 提升 4 倍，6.7G 数据量下热数据可驻留缓存；拿到宿主机内存证据后按 ≥6G→1G 重估
    # - slow-query-log=1 + long-query-time=2：记录 >2s 慢查询，为后续容量评估提供实测数据
    # - slow-query-log-file=/var/lib/mysql/slow.log：落在 /var/lib/mysql 即宿主机
    #   ${MYSQL_DATA_DIR:-/data/database/mysql-data}/slow.log（bind mount 见上），便于直接巡检
    # ⚠️ 生效需 recreate 容器（docker compose up -d mysql 会因 command 变化自动重建）
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
      --max-connections=300
      --innodb-buffer-pool-size=536870912
      --slow-query-log=1
      --long-query-time=2
      --slow-query-log-file=/var/lib/mysql/slow.log
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-aigicrm}-redis
    restart: always
    volumes:
      - redis-data:/data

  # 后端服务
  backend:
    image: ${APP_SLUG:-aigicrm}-backend:2.7.0
    container_name: ${APP_SLUG:-aigicrm}-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aigicrm}
      # 应用最小权限账号（非 root），经部署 env 注入
      DB_USER: ${APP_DB_USER:?APP_DB_USER 未设置（应用最小权限账号）}
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD 未设置}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 【PR-01 G-02】生产租户开关必须显式设置（无静默 false 默认），与后端 prod fail-closed 自检配合
      TENANT_ENABLE: ${TENANT_ENABLE:?TENANT_ENABLE 未设置（生产必须显式开启租户隔离，设为 true）}
      STORAGE_TYPE: local
      # 【上线批次 2026-09-22】生产 CORS 收敛: 去掉 localhost 调试源(SEC-P3-002 挂账清偿, GPT外审 AUD-P2 复追);
      # 前端同域反代本不需要 CORS, 此值仅作额外收紧;本地调试请走 override 文件
      CORS_ORIGINS: https://www.aigicrm.com
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      # 【GPT复审 P1-01 修复 2026-09-21】对齐部署规范: 上传文件走 NAS /Aigicrm/files/uploads,
      # 废弃历史 upload-data named volume(与 deploy-backend.sh 口径统一)
      - ${NAS_UPLOAD_DIR:-/Aigicrm/files/uploads}:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 前端服务（nginx 基础镜像 + NAS dist bind mount）
  frontend:
    image: ${APP_SLUG:-aigicrm}-frontend:2.6.1
    container_name: ${APP_SLUG:-aigicrm}-frontend
    environment:
      BACKEND_HOST: ${APP_SLUG:-aigicrm}-backend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      # 挂到模板目录：官方 nginx 镜像 entrypoint 启动时 envsubst 生成 conf.d/default.conf
      - ./nginx-ssl.conf:/etc/nginx/templates/default.conf.template:ro
      - ${NAS_DIST_DIR:-/Aigicrm/files/aigicrm-dist}:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  redis-data:
