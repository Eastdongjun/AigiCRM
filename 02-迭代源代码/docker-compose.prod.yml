version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0.28
    container_name: ${APP_SLUG:-aigicrm}-mysql
    restart: always
    environment:
      # 经部署 env 注入（DB_PASSWORD=已轮换的生产 root 密码，2026-08-08 后 123456 已失效）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置（经部署 env 注入，已轮换）}
      MYSQL_DATABASE: ${DB_NAME:-aigicrm}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-aigicrm}-redis
    restart: always
    volumes:
      - redis-data:/data

  # 后端服务
  backend:
    image: ${APP_SLUG:-aigicrm}-backend:2.7.0
    container_name: ${APP_SLUG:-aigicrm}-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aigicrm}
      # 应用最小权限账号（非 root），经部署 env 注入
      DB_USER: ${APP_DB_USER:?APP_DB_USER 未设置（应用最小权限账号）}
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD 未设置}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_TYPE: local
      CORS_ORIGINS: https://www.aigicrm.com,http://localhost:5173,http://localhost:3000
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-your-key}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-your-secret}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-your-bucket}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 前端服务（nginx 基础镜像 + NAS dist bind mount）
  frontend:
    image: ${APP_SLUG:-aigicrm}-frontend:2.6.1
    container_name: ${APP_SLUG:-aigicrm}-frontend
    environment:
      BACKEND_HOST: ${APP_SLUG:-aigicrm}-backend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      # 挂到模板目录：官方 nginx 镜像 entrypoint 启动时 envsubst 生成 conf.d/default.conf
      - ./nginx-ssl.conf:/etc/nginx/templates/default.conf.template:ro
      - ${NAS_DIST_DIR:-/Aigicrm/files/aigicrm-dist}:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  upload-data:
    external: true
    name: upload-data
