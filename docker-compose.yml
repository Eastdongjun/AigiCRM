version: '3.8'

services:
  # 后端服务 — 复用共享 MySQL/Redis（在生产/测试中均已存在）
  backend:
    build:
      context: ./ycmn-backend
      dockerfile: Dockerfile
    container_name: ycmn-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: shared-mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: '<redacted>'
      REDIS_HOST: shared-redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-your-key}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-your-secret}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-aigicrm-files}
    volumes:
      - upload-data:/app/uploads

  # 前端服务
  frontend:
    build:
      context: ./ycmn-ui
      dockerfile: Dockerfile
    container_name: ycmn-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  upload-data:
