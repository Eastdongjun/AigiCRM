server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/ycmn?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT
jwt:
  secret: ycmn-market-resource-management-system-jwt-secret-key-2026
  expiration: 86400000  # 24小时
  remember-expiration: 604800000  # 7天

# 文件存储
file:
  storage-type: ${STORAGE_TYPE:local}
  upload-dir: ${UPLOAD_DIR:./uploads}

# 阿里云 OSS
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:LTAI5t7Rvi8NjoLZuJh83cUm}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:crVwCDRoxBa3nNtw1MokoOje2caTKi}
    bucket-name: ${OSS_BUCKET_NAME:ycmn-files}
  sms:
    sign-name: ${SMS_SIGN_NAME:陕西青阳耀东科技}
    template-code: ${SMS_TEMPLATE_CODE:SMS_335400207}

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ycmn.module

logging:
  level:
    com.ycmn: debug

---
# Redis集群模式: 设置环境变量 SPRING_PROFILES_ACTIVE=cluster 激活
spring:
  config:
    activate:
      on-profile: cluster
  data:
    redis:
      host:
      cluster:
        nodes:
          - ${REDIS_HOST:localhost}:6379
          - ${REDIS_HOST:localhost}:6380
          - ${REDIS_HOST:localhost}:6381
