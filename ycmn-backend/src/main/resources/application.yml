server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/ycmn?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}  # 仅本地开发默认值，生产环境覆盖
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT
# ⚠️ 生产环境必须注入 JWT_SECRET 环境变量（至少256位随机密钥）
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-do-not-use-in-production}
  expiration: 86400000  # 24小时
  remember-expiration: 604800000  # 7天

# 文件存储
file:
  storage-type: ${STORAGE_TYPE:local}
  upload-dir: ${UPLOAD_DIR:./uploads}

# 阿里云 OSS — 生产环境必须通过环境变量注入真实密钥
# ⚠️ 已泄露的旧密钥已作废，请在阿里云控制台生成新密钥并轮换
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:aigicrm-files}
  sms:
    sign-name: ${SMS_SIGN_NAME:陕西青阳耀东科技}
    template-code: ${SMS_TEMPLATE_CODE:SMS_335400207}

# Knife4j — 开发环境可访问，生产环境通过 security config 限制
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ycmn.module

# CORS — 生产环境必须改为具体域名
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.ycmn: debug

---
# Redis集群模式: 设置环境变量 SPRING_PROFILES_ACTIVE=cluster 激活
spring:
  config:
    activate:
      on-profile: cluster
  data:
    redis:
      host:
      cluster:
        nodes:
          - ${REDIS_HOST:localhost}:6379
          - ${REDIS_HOST:localhost}:6380
          - ${REDIS_HOST:localhost}:6381
